<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-warning">
    <div class="container ">
        <div class="row">
            <div class="col-4">
                 </div>
                <div class="col-4 mt-5">
                    <h2 class="text-center text-primary">GitHub user finder</h2>
                    <div>
                        <input type="text" class="form-control" placeholder="Enter GitHub user name" id="uname">
                        <button class="btn btn-success mt-2" onclick="user()">Search</button>
                    </div>
                    <div id="result"></div>
                </div>
                <div class="col-4"></div>
           
        </div>
    </div>
    

    <script>
function user() {
  const username = document.getElementById("uname").value.trim();
  let rslt = document.getElementById("result");

  if (username === "") {
    rslt.innerHTML = `<div class="alert alert-warning">Please enter a username</div>`;
    return;
  }

  let response = new XMLHttpRequest();
  response.open("GET", "https://api.github.com/users/" + username);
  response.send();

  response.onreadystatechange = () => {
    if (response.readyState === 4) {
      if (response.status === 200) {
        let user = JSON.parse(response.responseText);
        displayData(user);
      } else {
        rslt.innerHTML = `<div class="text-danger">
            const alert=alert("User not found")</div>`;
      }
    }
  };
}

function displayData(user) {
  let rslt = document.getElementById("result");
  rslt.innerHTML = `
    <div class="card shadow-sm mt-3">
      <div class="card-body text-center">
        <img src="${user.avatar_url}" class="rounded-circle mb-3" width="120" height="120">
        <h4>${user.name }</h4>
        <p>Bio:${user.bio }</p>
        <p>Followers:${user.followers}</p>
        <p>Public Repos: ${user.public_repos}</p>
        <a href="${user.html_url}" class="btn btn-primary">View Profile</a>
      </div>
    </div>
  `;
}
</script>
    
</body>
</html>
